<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IT Helpdesk{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn">&#9776;</button>
    <h1>&#128736; IT Helpdesk</h1>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint=='dashboard' }}">&#128202; Dashboard</a>
      <a href="{{ url_for('create_ticket') }}" class="{{ 'active' if request.endpoint=='create_ticket' }}">&#10133; Create Ticket</a>
      <a href="{{ url_for('tickets') }}" class="{{ 'active' if request.endpoint=='tickets' }}">&#128203; All Tickets</a>
    </nav>
    <main class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
