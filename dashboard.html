{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2>Dashboard</h2>
<div class="cards">
  <div class="card"><span>&#128193;</span><p>Total Tickets</p><h3>{{ total }}</h3></div>
  <div class="card open"><span>&#128308;</span><p>Open</p><h3>{{ counts['Open'] }}</h3></div>
  <div class="card progress"><span>&#9203;</span><p>In Progress</p><h3>{{ counts['In Progress'] }}</h3></div>
  <div class="card resolved"><span>&#9989;</span><p>Resolved</p><h3>{{ counts['Resolved'] }}</h3></div>
</div>
{% endblock %}
