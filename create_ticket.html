{% extends "base.html" %}
{% block title %}Create Ticket{% endblock %}
{% block content %}
<h2>Create a Support Ticket</h2>
<form method="POST" class="panel" id="ticketForm" novalidate>
  <label>Ticket Title *</label>
  <input type="text" name="title" maxlength="150" required value="{{ form.get('title','') }}">
  <label>Issue Description *</label>
  <textarea name="description" rows="5" required>{{ form.get('description','') }}</textarea>
  <div class="row">
    <div>
      <label>Category *</label>
      <select name="category" required>
        <option value="">-- Select --</option>
        {% for c in categories %}<option {{ 'selected' if form.get('category')==c }}>{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Priority *</label>
      <select name="priority" required>
        <option value="">-- Select --</option>
        {% for p in priorities %}<option {{ 'selected' if form.get('priority')==p }}>{{ p }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <p class="form-error" id="formError"></p>
  <button type="submit" class="btn">Submit Ticket</button>
</form>
{% endblock %}
